[project]
name = "quote-check-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8",
    "openai>=3.35.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
